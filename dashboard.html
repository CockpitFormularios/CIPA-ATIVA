<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel SESMT | CIPA Ativa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦺</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  :root { --green-900:#0d2818; --green-700:#1e5f3f; --green-600:#2e8b57; --green-500:#3fb878;
    --yellow:#ffc93c; --yellow-dark:#e8b324; --bg:#f5f7fa; --card:#fff; --text:#0f172a;
    --text-soft:#64748b; --border:#e8ecf1; --danger:#ef4444; --warning:#f59e0b;
    --success:#10b981; --info:#3b82f6; --radius:16px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
    --shadow-md: 0 4px 16px rgba(15,23,42,0.06);
    --shadow-lg: 0 12px 32px rgba(15,23,42,0.10); }
  body { background: var(--bg); color: var(--text); min-height: 100vh;
    font-size: 14px; -webkit-font-smoothing: antialiased; display: flex; }
  .loading-overlay { position: fixed; inset: 0; background: var(--green-900);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 16px; z-index: 9999; color: #fff; transition: opacity 0.4s; }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner-lg { width: 50px; height: 50px; border: 4px solid rgba(255,201,60,0.2);
    border-top-color: var(--yellow); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sidebar { width: 264px; background: var(--green-900); color: #fff;
    padding: 24px 16px; position: fixed; height: 100vh; overflow-y: auto;
    transition: transform 0.3s; z-index: 100; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px; }
  .brand-icon { width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--yellow), var(--yellow-dark));
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; color: var(--green-900);
    box-shadow: 0 4px 12px rgba(255,201,60,0.3); }
  .brand-text h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .brand-text span { font-size: 11px; color: var(--yellow); font-weight: 500; }
  .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
    color: rgba(255,255,255,0.4); padding: 12px 12px 8px; font-weight: 600; }
  .sidebar nav a { display: flex; align-items: center; gap: 12px; padding: 11px 12px;
    color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13.5px;
    font-weight: 500; border-radius: 10px; margin-bottom: 2px;
    transition: all 0.18s; cursor: pointer; }
  .sidebar nav a:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .sidebar nav a.active { background: linear-gradient(90deg, var(--green-600), var(--green-700));
    color: #fff; box-shadow: 0 4px 12px rgba(46,139,87,0.35); }
  .sidebar nav a .icon { font-size: 17px; width: 20px; text-align: center; }
  .sidebar-footer { margin-top: auto; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.08); display: flex;
    align-items: center; gap: 10px; padding-left: 8px; }
  .avatar-sm { width: 36px; height: 36px; border-radius: 50%;
    background: var(--green-600); display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .sidebar-footer .info { flex: 1; min-width: 0; }
  .sidebar-footer .info small { display: block; color: rgba(255,255,255,0.5); font-size: 11px; }
  .sidebar-footer .info strong { font-size: 13px; font-weight: 600;
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-logout { background: rgba(255,255,255,0.1); border: none; color: #fff;
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    font-size: 14px; transition: all 0.2s; flex-shrink: 0; }
  .btn-logout:hover { background: var(--danger); }
  .main { margin-left: 264px; flex: 1; padding: 28px 32px 100px;
    width: calc(100% - 264px); }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
  .topbar h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .topbar h2 span { color: var(--text-soft); font-size: 13.5px;
    font-weight: 400; display: block; margin-top: 4px; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .sesmt-badge { background: linear-gradient(135deg, rgba(46,139,87,0.12), rgba(255,201,60,0.12));
    color: var(--green-700); padding: 8px 16px; border-radius: 30px;
    font-size: 12px; font-weight: 700; border: 1px solid rgba(46,139,87,0.2); }
  .menu-toggle { display: none; width: 40px; height: 40px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px; margin-bottom: 24px; }
  .kpi { background: var(--card); padding: 22px; border-radius: var(--radius);
    box-shadow: var(--shadow-sm); border: 1px solid var(--border);
    transition: all 0.25s; position: relative; overflow: hidden; cursor: pointer; }
  .kpi::before { content: ''; position: absolute; top: 0; left: 0;
    width: 4px; height: 100%; background: var(--green-600); }
  .kpi.warning::before { background: var(--warning); }
  .kpi.danger::before  { background: var(--danger); }
  .kpi.info::before    { background: var(--info); }
  .kpi:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .kpi-header { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; }
  .kpi-icon { width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; background: rgba(46,139,87,0.1); }
  .kpi.warning .kpi-icon { background: rgba(245,158,11,0.12); }
  .kpi.danger  .kpi-icon { background: rgba(239,68,68,0.12); }
  .kpi.info    .kpi-icon { background: rgba(59,130,246,0.12); }
  .kpi-value { font-size: 32px; font-weight: 800; letter-spacing: -1px;
    line-height: 1; margin-bottom: 6px; }
  .kpi-label { font-size: 13px; color: var(--text-soft); font-weight: 500; }
  .kpi-trend { font-size: 11.5px; font-weight: 600; margin-top: 12px;
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
    border-radius: 20px; }
  .trend-neutral { background: rgba(100,116,139,0.12); color: var(--text-soft); }
  .trend-up { background: rgba(16,185,129,0.12); color: var(--success); }
  .grid-2 { display: grid; grid-template-columns: 1.7fr 1fr;
    gap: 20px; margin-bottom: 24px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px; margin-bottom: 24px; }
  .card { background: var(--card); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
  .card-header { display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 20px; }
  .card-header h3 { font-size: 15.5px; font-weight: 700; letter-spacing: -0.2px; }
  .card-header a { font-size: 12.5px; color: var(--green-600);
    text-decoration: none; font-weight: 600; cursor: pointer; }
  .card-header a:hover { text-decoration: underline; }
  .gestao-card { background: linear-gradient(135deg, var(--green-900), var(--green-700));
    color: #fff; border-radius: var(--radius); padding: 24px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 20px; flex-wrap: wrap; box-shadow: var(--shadow-md);
    margin-bottom: 24px; position: relative; overflow: hidden; }
  .gestao-card::before { content: ''; position: absolute; top: -50px; right: -50px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255,201,60,0.15) 0%, transparent 70%);
    border-radius: 50%; }
  .gestao-card-info { display: flex; align-items: center; gap: 16px;
    position: relative; z-index: 1; }
  .gestao-card-icon { width: 60px; height: 60px;
    background: linear-gradient(135deg, var(--yellow), var(--yellow-dark));
    border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: var(--green-900);
    box-shadow: 0 8px 20px rgba(255,201,60,0.4); }
  .gestao-card-text h3 { font-size: 20px; font-weight: 800;
    margin-bottom: 4px; display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap; }
  .gestao-card-text p { font-size: 13px; color: rgba(255,255,255,0.75); }
  .gestao-card-badge { background: rgba(16,185,129,0.2); color: #6ee7b7;
    padding: 4px 12px; border-radius: 20px; font-size: 10.5px;
    font-weight: 700; letter-spacing: 0.5px; }
  .gestao-card-actions { display: flex; gap: 10px; flex-wrap: wrap;
    position: relative; z-index: 1; }
  .btn-ghost { background: rgba(255,255,255,0.12); color: #fff;
    border: 1px solid rgba(255,255,255,0.15); padding: 10px 18px;
    border-radius: 10px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; display: inline-flex;
    align-items: center; gap: 8px; font-family: inherit; }
  .btn-ghost:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
  .atalho-card { background: var(--card); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
    cursor: pointer; transition: all 0.25s; display: flex;
    align-items: center; gap: 16px; position: relative; overflow: hidden; }
  .atalho-card:hover { transform: translateY(-4px);
    box-shadow: var(--shadow-lg); border-color: var(--green-600); }
  .atalho-card::after { content: '→'; position: absolute; right: 20px;
    top: 50%; transform: translateY(-50%); font-size: 20px;
    color: var(--text-soft); opacity: 0.3; transition: all 0.25s; }
  .atalho-card:hover::after { opacity: 1; color: var(--green-600);
    transform: translateY(-50%) translateX(4px); }
  .atalho-icon { width: 52px; height: 52px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0; }
  .atalho-icon.membros { background: rgba(46,139,87,0.12); }
  .atalho-icon.gestoes { background: rgba(255,201,60,0.2); }
  .atalho-icon.relatorios { background: rgba(59,130,246,0.12); }
  .atalho-info h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 3px; }
  .atalho-info p { font-size: 12px; color: var(--text-soft); line-height: 1.3; }
  .list { list-style: none; }
  .list li { display: flex; align-items: center; gap: 12px;
    padding: 13px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .list li:last-child { border-bottom: none; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-soft); }
  .empty-state .icon { font-size: 42px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state p { font-size: 13px; font-weight: 500; }
  .empty-state small { font-size: 11.5px; color: #94a3b8;
    display: block; margin-top: 6px; }
  .toast { position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px); background: var(--green-900);
    color: #fff; padding: 14px 24px; border-radius: 12px; font-size: 13.5px;
    font-weight: 600; box-shadow: var(--shadow-lg); z-index: 300;
    transition: transform 0.3s; max-width: 90vw; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  @media (max-width: 1024px) { .grid-2 { grid-template-columns: 1fr; } }
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; width: 100%; padding: 20px 16px 100px; }
    .topbar h2 { font-size: 20px; }
    .kpi-value { font-size: 26px; }
    .menu-toggle { display: flex; }
    .gestao-card { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner-lg"></div>
  <p style="font-weight:600;">Carregando painel...</p>
</div>

<aside class="sidebar"
