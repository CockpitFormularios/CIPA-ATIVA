<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CIPA Ativa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦺</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

  body {
    background: linear-gradient(135deg, #0d2818 0%, #143d28 50%, #1e5f3f 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Efeitos decorativos de fundo */
  body::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255,201,60,0.08) 0%, transparent 70%);
    top: -200px; right: -200px;
    border-radius: 50%;
  }

  body::after {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(63,184,120,0.1) 0%, transparent 70%);
    bottom: -150px; left: -150px;
    border-radius: 50%;
  }

  .login-container {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 2;
    animation: fadeUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .login-card {
    background: rgba(255, 255, 255, 0.98);
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5);
    backdrop-filter: blur(20px);
  }

  .login-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 72px; height: 72px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, #1e5f3f, #2e8b57);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 800;
    color: #ffc93c;
    box-shadow: 0 10px 30px rgba(30, 95, 63, 0.3);
    position: relative;
  }

  .logo-icon::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 22px;
    background: linear-gradient(135deg, #ffc93c, #e8b324);
    z-index: -1;
    opacity: 0.5;
  }

  .login-header h1 {
    font-size: 28px;
    font-weight: 800;
    color: #0d2818;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .login-header p {
    font-size: 13.5px;
    color: #64748b;
    font-weight: 500;
  }

  .form-group { margin-bottom: 18px; }

  .form-group label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: #0f172a;
    margin-bottom: 8px;
  }

  .input-wrapper { position: relative; }

  .input-wrapper input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    font-size: 14px;
    font-family: inherit;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    outline: none;
    transition: all 0.2s;
    background: #fafbfc;
    color: #0f172a;
  }

  .input-wrapper input:focus {
    border-color: #2e8b57;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(46, 139, 87, 0.1);
  }

  .input-wrapper .icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: #94a3b8;
    pointer-events: none;
  }

  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    color: #94a3b8;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .toggle-password:hover { background: #f1f5f9; color: #0f172a; }

  .btn-login {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    color: #0d2818;
    background: linear-gradient(135deg, #ffc93c, #e8b324);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 6px 20px rgba(255, 201, 60, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }

  .btn-login:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(255, 201, 60, 0.5);
  }

  .btn-login:active:not(:disabled) { transform: translateY(0); }

  .btn-login:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .message {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    margin-top: 16px;
    display: none;
    animation: shake 0.4s;
  }

  .message.show { display: block; }

  .message.error {
    background: #fee2e2;
    color: #b91c1c;
    border: 1px solid #fecaca;
  }

  .message.success {
    background: #dcfce7;
    color: #15803d;
    border: 1px solid #bbf7d0;
  }

  .message.info {
    background: #e0f2fe;
    color: #075985;
    border: 1px solid #bae6fd;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .footer-note {
    text-align: center;
    margin-top: 24px;
    font-size: 11.5px;
    color: #94a3b8;
  }

  .footer-note strong { color: #2e8b57; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(13, 40, 24, 0.3);
    border-top-color: #0d2818;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <div class="logo-icon">C</div>
      <h1>CIPA Ativa</h1>
      <p>Comissão Interna de Prevenção de Acidentes</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <span class="icon">📧</span>
          <input type="email" id="email" placeholder="seu@cipaativa.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-password" onclick="toggleSenha()" title="Mostrar/ocultar senha">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span id="btnText">ENTRAR</span>
      </button>

      <div class="message" id="message"></div>
    </form>

    <div class="footer-note">
      Sistema de gestão da <strong>CIPA</strong> • Uso restrito
    </div>

  </div>
</div>

<!-- ============================================== -->
<!-- CLIENTE SUPABASE                                -->
<!-- ============================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://rvtquhqeivrhcdoreghu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_kNF6eX_67yzNGWIyjwZvOw_0__qWSMW';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>

<script>
  // ============ ELEMENTOS ============
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const messageEl = document.getElementById('message');
  const btnLogin = document.getElementById('btnLogin');
  const btnText = document.getElementById('btnText');

  // ============ HELPERS ============
  function mostrarMensagem(texto, tipo = 'info') {
    messageEl.textContent = texto;
    messageEl.className = 'message show ' + tipo;
  }

  function esconderMensagem() {
    messageEl.className = 'message';
  }

  function setLoading(loading) {
    btnLogin.disabled = loading;
    btnText.innerHTML = loading
      ? '<span class="spinner"></span> Entrando...'
      : 'ENTRAR';
  }

  function toggleSenha() {
    passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
  }

  // ============ VERIFICAR SE JÁ ESTÁ LOGADO ============
  async function verificarSessao() {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      window.location.href = 'dashboard.html';
    }
  }

  // ============ LOGIN ============
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    esconderMensagem();

    const email = emailInput.value.trim().toLowerCase();
    const senha = passwordInput.value;

    if (!email || !senha) {
      mostrarMensagem('⚠️ Preencha e-mail e senha', 'error');
      return;
    }

    setLoading(true);
    mostrarMensagem('⏳ Verificando...', 'info');

    try {
      // 1. Autenticar no Supabase
      const { data, error } = await db.auth.signInWithPassword({
        email: email,
        password: senha
      });

      if (error) {
        let msg = '❌ ' + error.message;
        if (error.message.includes('Invalid login credentials')) {
          msg = '❌ E-mail ou senha incorretos';
        } else if (error.message.includes('Email not confirmed')) {
          msg = '⚠️ E-mail não confirmado. Contate o administrador.';
        } else if (error.message.includes('Too many requests')) {
          msg = '⚠️ Muitas tentativas. Aguarde alguns minutos.';
        }
        mostrarMensagem(msg, 'error');
        passwordInput.value = '';
        passwordInput.focus();
        setLoading(false);
        return;
      }

      // 2. Buscar o perfil (nome + role)
      const { data: perfil } = await db
        .from('profiles')
        .select('*')
        .eq('id', data.user.id)
        .single();

      // 3. Salvar dados do usuário
      const userData = {
        id: data.user.id,
        email: data.user.email,
        nome: perfil?.full_name || data.user.email,
        role: perfil?.role || 'member'
      };

      sessionStorage.setItem('cipa_user', JSON.stringify(userData));

      const nomeCurto = userData.nome.split('@')[0];
      const nomeCapitalizado = nomeCurto.charAt(0).toUpperCase() + nomeCurto.slice(1);

      mostrarMensagem(`✅ Bem-vindo, ${nomeCapitalizado}!`, 'success');

      // 4. Redirecionar
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 800);

    } catch (err) {
      console.error(err);
      mostrarMensagem('❌ Erro inesperado. Tente novamente.', 'error');
      setLoading(false);
    }
  });

  // ============ INICIALIZAÇÃO ============
  verificarSessao();
  emailInput.focus();
</script>

</body>
</html>
